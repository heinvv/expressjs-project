<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register a Match - Soccer League</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Soccer League</h1>
    <p class="subtitle">Express.js study project</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="teams.html">Register Team</a>
      <a href="matches.html" aria-current="page">Register Match</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Register a Match</h2>
      <form id="match-form" class="form">
        <div class="field-row">
          <div class="field">
            <label for="team-a">Team 1</label>
            <select id="team-a" name="teamA" required>
              <option value="">Select a team&hellip;</option>
              <option value="FC Barcelona">FC Barcelona</option>
              <option value="Real Madrid">Real Madrid</option>
            </select>
          </div>
          <div class="field field-goals">
            <label for="goals-a">Goals</label>
            <input type="number" id="goals-a" name="goalsA" min="0" value="0" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="team-b">Team 2</label>
            <select id="team-b" name="teamB" required>
              <option value="">Select a team&hellip;</option>
              <option value="FC Barcelona">FC Barcelona</option>
              <option value="Real Madrid">Real Madrid</option>
            </select>
          </div>
          <div class="field field-goals">
            <label for="goals-b">Goals</label>
            <input type="number" id="goals-b" name="goalsB" min="0" value="0" required />
          </div>
        </div>

        <button type="submit">Register Match</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Team options are placeholders &mdash; populate the &lt;select&gt; elements from your <code>/teams</code> route once it exists. See docs/setup.md.</p>
  </footer>
</body>
</html>
